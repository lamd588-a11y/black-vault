<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>黑匣 Black Vault</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- 載入 QR Code 生成庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: rgba(20, 24, 35, 0.75);
      --accent-color: #00f0ff;
      --text-main: #f0f4f8;
      --text-sub: #8a99ad;
      --danger: #ff3b30;
    }
    body {
      margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color); color: var(--text-main); min-height: 100vh; box-sizing: border-box;
    }
    h1 { font-size: 24px; text-align: center; color: var(--accent-color); letter-spacing: 2px; margin-bottom: 20px; }
    .card {
      background: var(--card-bg); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 16px;
      padding: 16px; margin-bottom: 16px; backdrop-filter: blur(10px);
      transition: transform 0.2s, opacity 0.2s;
    }
    /* 拖拉卡片樣式 */
    .card.draggable {
      cursor: grab;
      user-select: none;
    }
    .card.dragging {
      opacity: 0.4;
      transform: scale(0.98);
      border-color: var(--accent-color);
    }
    .drag-handle {
      display: inline-block;
      margin-right: 8px;
      color: var(--accent-color);
      font-size: 18px;
      cursor: grab;
    }
    .btn {
      display: block; width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 10px;
      font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; box-sizing: border-box;
    }
    .btn-primary { background: var(--accent-color); color: #000; }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.2); }
    .btn-danger { background: var(--danger); color: #fff; }
    input[type="password"], input[type="text"] {
      width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid rgba(0,240,255,0.3);
      background: rgba(0,0,0,0.5); color: #fff; font-size: 16px; box-sizing: border-box;
    }

    /* 解鎖遮罩鎖屏 */
    #lockScreen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg-color); z-index: 9999; display: flex;
      flex-direction: column; justify-content: center; align-items: center; padding: 30px; box-sizing: border-box;
    }

    /* PDF 備份頁面樣式 (預設隱藏，僅列印/匯出 PDF 時顯示) */
    #pdfContainer {
      display: none;
      background: #ffffff; color: #000000; padding: 40px; font-family: sans-serif;
    }
    
    @media print {
      body * { visibility: hidden; }
      #pdfContainer, #pdfContainer * { visibility: visible; }
      #pdfContainer { display: block; position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body>

  <!-- 解鎖遮罩 -->
  <div id="lockScreen">
    <h1 style="font-size:28px;">🔒 黑匣 BLACK VAULT</h1>
    <p style="color:var(--text-sub);">請輸入 App 解鎖密碼</p>
    <button class="btn btn-primary" id="bioUnlockBtn" onclick="unlockWithBiometrics()" style="display:none; max-width:300px; margin-bottom:15px;">
      👤 使用 Face ID / Touch ID 解鎖
    </button>
    <input type="password" id="passcodeInput" placeholder="輸入解密密碼" style="max-width:300px; text-align:center;">
    <button class="btn btn-secondary" onclick="unlockApp()" style="max-width:300px;">密碼解鎖</button>
  </div>

  <!-- App 主內容 -->
  <div id="mainApp" style="display:none;">
    <h1>黑匣 BLACK VAULT</h1>

    <!-- 新增分類按鈕區 -->
    <div style="margin-bottom: 15px;">
      <button class="btn btn-primary" onclick="addNewCategory()">➕ 新增黑匣分類</button>
    </div>

    <!-- 可拖拉排序的分類容器 -->
    <div id="categoryContainer"></div>

    <!-- PDF 備份與還原功能區 -->
    <div class="card">
      <h3 style="margin-top:0; color:var(--accent-color);">PDF 安全備份與還原</h3>
      <p style="font-size: 14px; color: var(--text-sub);">生成含有加密 QR Code 的專屬 PDF 備份檔，可儲存至 iPhone 檔案或雲端。</p>
      <button class="btn btn-primary" onclick="generatePDFBackup()">📄 生成 PDF 備份檔</button>
      <button class="btn btn-secondary" onclick="importFromQRCode()">📷 輸入/貼上加密字串還原</button>
    </div>

    <!-- 解鎖與資安設定 -->
    <div class="card">
      <h3 style="margin-top:0; color:var(--accent-color);">解鎖與資安設定</h3>
      <p style="font-size: 14px; color: var(--text-sub);" id="lockStatusText">目前狀態：尚未設定密碼</p>
      <button class="btn btn-primary" onclick="setAppPasscode()">自訂／修改解鎖密碼</button>
      <button class="btn btn-secondary" id="enableBioBtn" onclick="registerBiometrics()" style="display:none;">啟用 Face ID / Touch ID</button>
      <button class="btn btn-danger" onclick="removeAppPasscode()" id="removePassBtn" style="display:none;">取消 App 解鎖功能</button>
    </div>
  </div>

  <!-- PDF 生成範本區域 -->
  <div id="pdfContainer">
    <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 20px;">
      <h1 style="color: #000; margin: 0; font-size: 28px;">黑匣 BLACK VAULT</h1>
      <p style="margin: 5px 0 0 0; color: #555;">加密安全備份憑證 (Encrypted Backup Vault)</p>
    </div>

    <div style="display: flex; justify-content: space-around; align-items: center; margin-bottom: 30px;">
      <div id="qrcode" style="padding: 10px; border: 1px solid #ccc; background: #fff;"></div>
      <div style="max-width: 250px;">
        <p><strong>備份日期：</strong><span id="pdfDate"></span></p>
        <p><strong>安全級別：</strong>AES-256 高強度加密</p>
        <p style="font-size: 12px; color: #666;">說明：請妥善保存此 PDF 檔。復原時只需複製下方的加密密文或掃描左側 QR Code 即可。</p>
      </div>
    </div>

    <div style="background: #f5f5f5; padding: 15px; border-radius: 8px; word-break: break-all;">
      <h4 style="margin-top: 0;">加密備份密文 (Encrypted Payload):</h4>
      <p id="pdfPayload" style="font-family: monospace; font-size: 10px; color: #333;"></p>
    </div>
  </div>

  <script>
    let vaultData = [];

    function verifyOperation(actionName, success) {
      if (success) {
        console.log(`[驗證成功] ${actionName} 已順利完成。`);
      } else {
        console.warn(`[驗證失敗] ${actionName} 操作未完全執行。`);
      }
    }

    // 載入資料並初始化
    window.onload = function() {
      loadVaultData();
      const savedPasscode = localStorage.getItem('black_vault_passcode');
      const bioEnabled = localStorage.getItem('black_vault_bio_enabled');

      if (!savedPasscode) {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
      } else {
        if (bioEnabled && window.PublicKeyCredential) {
          document.getElementById('bioUnlockBtn').style.display = 'block';
          setTimeout(unlockWithBiometrics, 300);
        }
      }
      updatePasscodeUI();
    };

    function loadVaultData() {
      const saved = localStorage.getItem('black_vault_data');
      vaultData = saved ? JSON.parse(saved) : [
        { id: '1', title: '預設密碼庫', items: [] }
      ];
      renderCategories();
    }

    function saveVaultData() {
      localStorage.setItem('black_vault_data', JSON.stringify(vaultData));
    }

    // 渲染分類卡片（含拖拉事件綁定）
    function renderCategories() {
      const container = document.getElementById('categoryContainer');
      container.innerHTML = '';

      vaultData.forEach((cat, index) => {
        const card = document.createElement('div');
        card.className = 'card draggable';
        card.draggable = true;
        card.dataset.index = index;

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0; color:var(--accent-color);">
              <span class="drag-handle">☰</span> ${cat.title}
            </h3>
            <button class="btn btn-danger" style="width:auto; padding:4px 10px; margin:0; font-size:12px;" onclick="deleteCategory('${cat.id}')">刪除</button>
          </div>
        `;

        // 拖拉排序事件監聽
        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragover', handleDragOver);
        card.addEventListener('drop', handleDrop);
        card.addEventListener('dragend', handleDragEnd);

        container.appendChild(card);
      });
    }

    // 拖拉排序 (Drag & Drop) 邏輯
    let draggedIndex = null;

    function handleDragStart(e) {
      draggedIndex = +this.dataset.index;
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDrop(e) {
      e.preventDefault();
      const targetIndex = +this.dataset.index;
      if (draggedIndex !== null && draggedIndex !== targetIndex) {
        // 調整陣列順序
        const draggedItem = vaultData.splice(draggedIndex, 1)[0];
        vaultData.splice(targetIndex, 0, draggedItem);
        saveVaultData();
        renderCategories();
        verifyOperation("分類拖拉排序", true);
      }
    }

    function handleDragEnd() {
      this.classList.remove('dragging');
      draggedIndex = null;
    }

    // 新增/刪除分類
    function addNewCategory() {
      const title = prompt("請輸入新分類名稱：");
      if (title) {
        vaultData.push({ id: Date.now().toString(), title: title, items: [] });
        saveVaultData();
        renderCategories();
      }
    }

    function deleteCategory(id) {
      if (confirm("確定要刪除此分類？")) {
        vaultData = vaultData.filter(c => c.id !== id);
        saveVaultData();
        renderCategories();
      }
    }

    // 金鑰衍生演算法 (PBKDF2)
    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
      );
    }

    // 生成 PDF 備份檔
    async function generatePDFBackup() {
      const password = prompt("請設定備份檔的解密密碼：");
      if (!password) return;

      try {
        const rawData = JSON.stringify(vaultData);
        const enc = new TextEncoder();
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        
        const key = await deriveKey(password, salt);
        const encryptedContent = await crypto.subtle.encrypt(
          { name: "AES-GCM", iv: iv }, key, enc.encode(rawData)
        );

        const backupPackage = {
          encrypted: true,
          salt: Array.from(salt),
          iv: Array.from(iv),
          data: Array.from(new Uint8Array(encryptedContent))
        };

        const jsonString = JSON.stringify(backupPackage);
        const base64Payload = btoa(jsonString);

        // 填入 PDF 範本內容
        document.getElementById('pdfDate').innerText = new Date().toLocaleDateString();
        document.getElementById('pdfPayload').innerText = base64Payload;

        // 生成 QR Code
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById('qrcode'), {
          text: base64Payload.substring(0, 800),
          width: 160,
          height: 160
        });

        // 觸發原生 PDF 儲存/列印介面
        window.print();
        verifyOperation("生成 PDF 備份", true);
      } catch (err) {
        alert("生成 PDF 失敗：" + err.message);
        verifyOperation("生成 PDF 備份", false);
      }
    }

    // 透過密文/QR Code 還原
    async function importFromQRCode() {
      const payload = prompt("請貼上 PDF 備份檔中的「加密備份密文」：");
      if (!payload) return;

      try {
        const jsonString = atob(payload.trim());
        const pkg = JSON.parse(jsonString);

        if (!pkg.encrypted || !pkg.salt || !pkg.iv || !pkg.data) {
          throw new Error("備份密文格式不符");
        }

        const password = prompt("請輸入該備份檔的解密密碼：");
        if (!password) return;

        const salt = new Uint8Array(pkg.salt);
        const iv = new Uint8Array(pkg.iv);
        const encryptedData = new Uint8Array(pkg.data);

        const key = await deriveKey(password, salt);
        const decryptedContent = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv }, key, encryptedData
        );

        const dec = new TextDecoder();
        const parsed = JSON.parse(dec.decode(decryptedContent));

        if (confirm("驗證成功！確定要匯入並覆蓋現有資料？")) {
          vaultData = parsed;
          saveVaultData();
          renderCategories();
          alert("資料已成功還原！");
          verifyOperation("PDF 還原", true);
        }
      } catch (err) {
        alert("還原失敗：解密密碼錯誤或密文無效。");
        verifyOperation("PDF 還原", false);
      }
    }

    // 解鎖與生物辨識邏輯
    function unlockApp() {
      const input = document.getElementById('passcodeInput').value;
      const savedPasscode = localStorage.getItem('black_vault_passcode');
      if (input === savedPasscode) {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        verifyOperation("密碼解鎖", true);
      } else {
        alert("解鎖密碼不正確！");
        verifyOperation("密碼解鎖", false);
      }
    }

    async function registerBiometrics() {
      if (!window.PublicKeyCredential) {
        alert("您的裝置不支援 Face ID / Touch ID。");
        return;
      }
      try {
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);
        const credential = await navigator.credentials.create({
          publicKey: {
            challenge: challenge,
            rp: { name: "黑匣 Black Vault" },
            user: { id: Uint8Array.from("user", c => c.charCodeAt(0)), name: "user@blackvault", displayName: "黑匣用戶" },
            pubKeyCredParams: [{ alg: -7, type: "public-key" }],
            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }
          }
        });
        if (credential) {
          localStorage.setItem('black_vault_bio_credential', credential.id);
          localStorage.setItem('black_vault_bio_enabled', 'true');
          alert("Face ID / Touch ID 已成功綁定！");
          updatePasscodeUI();
          verifyOperation("啟用生物辨識", true);
        }
      } catch (err) {
        alert("綁定失敗：" + err.message);
        verifyOperation("啟用生物辨識", false);
      }
    }

    async function unlockWithBiometrics() {
      const credId = localStorage.getItem('black_vault_bio_credential');
      if (!credId || !window.PublicKeyCredential) return;
      try {
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);
        const assertion = await navigator.credentials.get({
          publicKey: { challenge: challenge, userVerification: "required" }
        });
        if (assertion) {
          document.getElementById('lockScreen').style.display = 'none';
          document.getElementById('mainApp').style.display = 'block';
          verifyOperation("Face ID 解鎖", true);
        }
      } catch (err) {
        console.warn("生物辨識驗證未通過：" + err.message);
        verifyOperation("Face ID 解鎖", false);
      }
    }

    function setAppPasscode() {
      const currentPass = localStorage.getItem('black_vault_passcode');
      if (currentPass) {
        const verify = prompt("請先輸入當前解鎖密碼：");
        if (verify !== currentPass) { alert("驗證失敗！"); return; }
      }
      const newPass = prompt("請設定全新解鎖密碼：");
      if (!newPass) return;
      const confirmPass = prompt("請再次輸入新密碼：");
      if (newPass === confirmPass) {
        localStorage.setItem('black_vault_passcode', newPass);
        alert("密碼設定成功！");
        updatePasscodeUI();
        verifyOperation("設定解鎖密碼", true);
      } else {
        alert("兩次密碼不符！");
        verifyOperation("設定解鎖密碼", false);
      }
    }

    function removeAppPasscode() {
      const currentPass = localStorage.getItem('black_vault_passcode');
      const verify = prompt("請輸入解鎖密碼以關閉：");
      if (verify === currentPass) {
        localStorage.removeItem('black_vault_passcode');
        localStorage.removeItem('black_vault_bio_enabled');
        localStorage.removeItem('black_vault_bio_credential');
        alert("防護已關閉！");
        updatePasscodeUI();
        verifyOperation("移除防護", true);
      } else {
        alert("密碼錯誤！");
        verifyOperation("移除防護", false);
      }
    }

    function updatePasscodeUI() {
      const savedPasscode = localStorage.getItem('black_vault_passcode');
      const bioEnabled = localStorage.getItem('black_vault_bio_enabled');
      const statusText = document.getElementById('lockStatusText');
      const removeBtn = document.getElementById('removePassBtn');
      const enableBioBtn = document.getElementById('enableBioBtn');

      if (savedPasscode) {
        let status = "目前狀態：已啟用密碼保護 🔒";
        if (bioEnabled) status += " + Face ID 👤";
        statusText.innerText = status;
        statusText.style.color = "#00f0ff";
        removeBtn.style.display = "block";
        enableBioBtn.style.display = "block";
      } else {
        statusText.innerText = "目前狀態：尚未設定密碼 (開啟即進入)";
        statusText.style.color = "var(--text-sub)";
        removeBtn.style.display = "none";
        enableBioBtn.style.display = "none";
      }
    }
  </script>
</body>
</html>
