<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>黑匣 Black Vault</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- 載入 QR Code 生成庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: rgba(20, 24, 35, 0.75);
      --accent-color: #00f0ff;
      --text-main: #f0f4f8;
      --text-sub: #8a99ad;
      --danger: #ff3b30;
      --success: #34c759;
    }
    body {
      margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color); color: var(--text-main); min-height: 100vh; box-sizing: border-box;
      padding-bottom: 60px;
    }
    h1, h2, h3 { color: var(--accent-color); margin-top: 0; }
    h1 { font-size: 24px; text-align: center; letter-spacing: 2px; margin-bottom: 20px; }
    
    .card {
      background: var(--card-bg); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 16px;
      padding: 16px; margin-bottom: 16px; backdrop-filter: blur(10px);
      transition: transform 0.2s, opacity 0.2s;
    }
    .card.draggable { cursor: grab; user-select: none; }
    .card.dragging { opacity: 0.4; transform: scale(0.98); border-color: var(--accent-color); }
    .drag-handle { display: inline-block; margin-right: 8px; color: var(--accent-color); cursor: grab; font-size: 18px; }

    .btn {
      display: block; width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 10px;
      font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; box-sizing: border-box;
    }
    .btn-inline { display: inline-block; width: auto; padding: 6px 12px; margin: 4px 2px; font-size: 13px; }
    .btn-primary { background: var(--accent-color); color: #000; }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.2); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }

    input, select, textarea {
      width: 100%; padding: 12px; margin: 6px 0 12px 0; border-radius: 8px;
      border: 1px solid rgba(0,240,255,0.3); background: rgba(0,0,0,0.5); color: #fff;
      font-size: 15px; box-sizing: border-box;
    }

    .item-row {
      background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px; margin: 8px 0;
      border-left: 3px solid var(--accent-color);
    }
    .item-title { font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
    .item-detail { font-size: 13px; color: var(--text-sub); margin-top: 4px; word-break: break-all; }

    /* 解鎖鎖屏 */
    #lockScreen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg-color); z-index: 9999; display: flex;
      flex-direction: column; justify-content: center; align-items: center; padding: 30px; box-sizing: border-box;
    }

    /* Modal 彈窗 */
    .modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 8888; display: none;
      justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
    }
    .modal-content {
      background: #141823; border: 1px solid var(--accent-color); border-radius: 16px;
      width: 100%; max-width: 500px; padding: 20px; max-height: 90vh; overflow-y: auto;
    }

    /* PDF 列印區域 */
    #pdfContainer { display: none; background: #fff; color: #000; padding: 40px; font-family: sans-serif; }
    @media print {
      body * { visibility: hidden; }
      #pdfContainer, #pdfContainer * { visibility: visible; }
      #pdfContainer { display: block; position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body>

  <!-- 解鎖遮罩鎖屏 -->
  <div id="lockScreen">
    <h1 style="font-size:28px;">🔒 黑匣 BLACK VAULT</h1>
    <p style="color:var(--text-sub);">請解鎖以存取您的私人黑匣</p>
    <button class="btn btn-primary" id="bioUnlockBtn" onclick="unlockWithBiometrics()" style="display:none; max-width:300px; margin-bottom:15px;">
      👤 使用 Face ID / Touch ID 解鎖
    </button>
    <input type="password" id="passcodeInput" placeholder="輸入解密密碼" style="max-width:300px; text-align:center;">
    <button class="btn btn-secondary" onclick="unlockApp()" style="max-width:300px;">密碼解鎖</button>
  </div>

  <!-- App 主內容區 -->
  <div id="mainApp" style="display:none;">
    <h1>黑匣 BLACK VAULT</h1>

    <!-- 搜尋與新增工具列 -->
    <div style="display:flex; gap:10px; margin-bottom:15px;">
      <input type="text" id="searchInput" placeholder="🔍 搜尋項目或帳號..." oninput="renderApp()" style="margin:0;">
      <button class="btn btn-primary" onclick="openItemModal()" style="width:auto; white-space:nowrap; margin:0;">➕ 新增密碼</button>
    </div>

    <!-- 分類與密碼卡片容器 (可拖拉排序) -->
    <div id="categoryContainer"></div>

    <div style="margin-top:20px;">
      <button class="btn btn-secondary" onclick="addNewCategory()">📁 新增分類</button>
    </div>

    <!-- 安全設定區 -->
    <div class="card" style="margin-top:30px;">
      <h3>🔒 資安與解鎖設定</h3>
      <p style="font-size:13px; color:var(--text-sub);" id="lockStatusText">目前狀態：未設定解鎖密碼</p>
      <button class="btn btn-primary" onclick="setAppPasscode()">設定／修改解鎖密碼</button>
      <button class="btn btn-secondary" id="enableBioBtn" onclick="registerBiometrics()" style="display:none;">啟用 Face ID / Touch ID</button>
      <button class="btn btn-danger" onclick="removeAppPasscode()" id="removePassBtn" style="display:none;">關閉解鎖保護</button>
    </div>

    <!-- PDF 備份與還原 -->
    <div class="card">
      <h3>📄 PDF 安全備份與還原</h3>
      <p style="font-size:13px; color:var(--text-sub);">將所有加密資料生成 PDF 憑證，支援在新手機掃描 QR Code 或貼上密文還原。</p>
      <button class="btn btn-primary" onclick="generatePDFBackup()">📄 生成加密 PDF 備份檔</button>
      <button class="btn btn-secondary" onclick="importFromQRCode()">📷 輸入加密密文還原</button>
    </div>
  </div>

  <!-- 新增/編輯密碼 Modal -->
  <div id="itemModal" class="modal">
    <div class="modal-content">
      <h3 id="modalTitle">新增密碼項目</h3>
      <input type="hidden" id="editItemId">
      
      <label style="font-size:12px; color:var(--text-sub);">選擇分類：</label>
      <select id="itemCategorySelect"></select>

      <label style="font-size:12px; color:var(--text-sub);">項目名稱 (例: Gmail / 銀行卡)：</label>
      <input type="text" id="itemName" placeholder="請輸入項目名稱">

      <label style="font-size:12px; color:var(--text-sub);">帳號 / 用戶名：</label>
      <input type="text" id="itemAccount" placeholder="請輸入帳號">

      <label style="font-size:12px; color:var(--text-sub);">密碼：</label>
      <input type="password" id="itemPassword" placeholder="請輸入密碼">

      <label style="font-size:12px; color:var(--text-sub);">網址 (可選)：</label>
      <input type="text" id="itemUrl" placeholder="https://...">

      <label style="font-size:12px; color:var(--text-sub);">備註 (可選)：</label>
      <textarea id="itemNotes" rows="3" placeholder="其他補充資訊..."></textarea>

      <button class="btn btn-primary" onclick="saveItem()">儲存</button>
      <button class="btn btn-secondary" onclick="closeItemModal()">取消</button>
    </div>
  </div>

  <!-- PDF 生成範本區 -->
  <div id="pdfContainer">
    <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 20px;">
      <h1 style="color: #000; margin: 0; font-size: 28px;">黑匣 BLACK VAULT</h1>
      <p style="margin: 5px 0 0 0; color: #555;">加密安全備份憑證 (Encrypted Backup Vault)</p>
    </div>
    <div style="display: flex; justify-content: space-around; align-items: center; margin-bottom: 30px;">
      <div id="qrcode" style="padding: 10px; border: 1px solid #ccc; background: #fff;"></div>
      <div style="max-width: 250px;">
        <p><strong>備份日期：</strong><span id="pdfDate"></span></p>
        <p><strong>安全級別：</strong>AES-256 高強度加密</p>
        <p style="font-size: 12px; color: #666;">說明：還原時請點擊 App 內的「輸入加密密文還原」，貼上下方密文即可。</p>
      </div>
    </div>
    <div style="background: #f5f5f5; padding: 15px; border-radius: 8px; word-break: break-all;">
      <h4 style="margin-top: 0;">加密備份密文 (Encrypted Payload):</h4>
      <p id="pdfPayload" style="font-family: monospace; font-size: 10px; color: #333;"></p>
    </div>
  </div>

  <script>
    let vaultData = [];

    // 初始化載入
    window.onload = function() {
      loadVaultData();
      const savedPasscode = localStorage.getItem('black_vault_passcode');
      const bioEnabled = localStorage.getItem('black_vault_bio_enabled');

      if (!savedPasscode) {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
      } else {
        if (bioEnabled && window.PublicKeyCredential) {
          document.getElementById('bioUnlockBtn').style.display = 'block';
          setTimeout(unlockWithBiometrics, 300);
        }
      }
      updatePasscodeUI();
    };

    function loadVaultData() {
      const saved = localStorage.getItem('black_vault_data');
      vaultData = saved ? JSON.parse(saved) : [
        { id: 'cat_default', title: '常用帳號', items: [] }
      ];
      renderApp();
    }

    function saveVaultData() {
      localStorage.setItem('black_vault_data', JSON.stringify(vaultData));
    }

    // 渲染 UI (包含拖拉與密碼資料)
    function renderApp() {
      const container = document.getElementById('categoryContainer');
      const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
      container.innerHTML = '';

      vaultData.forEach((cat, index) => {
        const filteredItems = cat.items.filter(item => 
          item.name.toLowerCase().includes(searchKeyword) || 
          item.account.toLowerCase().includes(searchKeyword)
        );

        if (searchKeyword && filteredItems.length === 0) return;

        const card = document.createElement('div');
        card.className = 'card draggable';
        card.draggable = true;
        card.dataset.index = index;

        let itemsHTML = filteredItems.map(item => `
          <div class="item-row">
            <div class="item-title">
              <span>🔑 ${escapeHtml(item.name)}</span>
              <div>
                <button class="btn btn-inline btn-secondary" onclick="togglePassword('${item.id}')">👁️</button>
                <button class="btn btn-inline btn-primary" onclick="copyText('${escapeHtml(item.password)}')">複製</button>
                <button class="btn btn-inline btn-secondary" onclick="editItem('${item.id}')">✏️</button>
                <button class="btn btn-inline btn-danger" onclick="deleteItem('${cat.id}', '${item.id}')">🗑️</button>
              </div>
            </div>
            <div class="item-detail">帳號: ${escapeHtml(item.account)}</div>
            <div class="item-detail" id="pwd_${item.id}" style="display:none; color:var(--accent-color);">密碼: ${escapeHtml(item.password)}</div>
            ${item.url ? `<div class="item-detail"><a href="${escapeHtml(item.url)}" target="_blank" style="color:var(--accent-color);">🔗 開啟網站</a></div>` : ''}
            ${item.notes ? `<div class="item-detail" style="font-style:italic;">備註: ${escapeHtml(item.notes)}</div>` : ''}
          </div>
        `).join('');

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3 style="margin:0; color:var(--accent-color);">
              <span class="drag-handle">☰</span> ${escapeHtml(cat.title)} (${filteredItems.length})
            </h3>
            <div>
              <button class="btn btn-inline btn-danger" onclick="deleteCategory('${cat.id}')">刪除分類</button>
            </div>
          </div>
          <div>${itemsHTML.length > 0 ? itemsHTML : '<p style="font-size:13px; color:var(--text-sub); text-align:center;">此分類尚無資料</p>'}</div>
        `;

        // 綁定拖拉事件
        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragover', handleDragOver);
        card.addEventListener('drop', handleDrop);
        card.addEventListener('dragend', handleDragEnd);

        container.appendChild(card);
      });
    }

    // 拖拉排序 (Drag & Drop) 邏輯
    let draggedIndex = null;
    function handleDragStart(e) { draggedIndex = +this.dataset.index; this.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
    function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
    function handleDrop(e) {
      e.preventDefault();
      const targetIndex = +this.dataset.index;
      if (draggedIndex !== null && draggedIndex !== targetIndex) {
        const draggedItem = vaultData.splice(draggedIndex, 1)[0];
        vaultData.splice(targetIndex, 0, draggedItem);
        saveVaultData();
        renderApp();
      }
    }
    function handleDragEnd() { this.classList.remove('dragging'); draggedIndex = null; }

    // 密碼項目 CRUD
    function openItemModal(itemId = null) {
      const select = document.getElementById('itemCategorySelect');
      select.innerHTML = vaultData.map(c => `<option value="${c.id}">${escapeHtml(c.title)}</option>`).join('');

      if (itemId) {
        let foundItem = null, foundCat = null;
        vaultData.forEach(c => c.items.forEach(i => { if(i.id === itemId) { foundItem = i; foundCat = c; } }));
        if (foundItem) {
          document.getElementById('modalTitle').innerText = "編輯密碼項目";
          document.getElementById('editItemId').value = foundItem.id;
          document.getElementById('itemCategorySelect').value = foundCat.id;
          document.getElementById('itemName').value = foundItem.name;
          document.getElementById('itemAccount').value = foundItem.account;
          document.getElementById('itemPassword').value = foundItem.password;
          document.getElementById('itemUrl').value = foundItem.url || '';
          document.getElementById('itemNotes').value = foundItem.notes || '';
        }
      } else {
        document.getElementById('modalTitle').innerText = "新增密碼項目";
        document.getElementById('editItemId').value = "";
        document.getElementById('itemName').value = "";
        document.getElementById('itemAccount').value = "";
        document.getElementById('itemPassword').value = "";
        document.getElementById('itemUrl').value = "";
        document.getElementById('itemNotes').value = "";
      }
      document.getElementById('itemModal').style.display = 'flex';
    }

    function closeItemModal() { document.getElementById('itemModal').style.display = 'none'; }

    function saveItem() {
      const id = document.getElementById('editItemId').value || Date.now().toString();
      const catId = document.getElementById('itemCategorySelect').value;
      const name = document.getElementById('itemName').value.trim();
      const account = document.getElementById('itemAccount').value.trim();
      const password = document.getElementById('itemPassword').value;
      const url = document.getElementById('itemUrl').value.trim();
      const notes = document.getElementById('itemNotes').value.trim();

      if (!name || !password) { alert("請填寫項目名稱與密碼！"); return; }

      // 移除舊項目 (若為編輯)
      vaultData.forEach(c => c.items = c.items.filter(i => i.id !== id));

      const targetCat = vaultData.find(c => c.id === catId);
      if (targetCat) {
        targetCat.items.push({ id, name, account, password, url, notes });
        saveVaultData();
        renderApp();
        closeItemModal();
      }
    }

    function deleteItem(catId, itemId) {
      if (confirm("確定要刪除此密碼項目？")) {
        const cat = vaultData.find(c => c.id === catId);
        if (cat) {
          cat.items = cat.items.filter(i => i.id !== itemId);
          saveVaultData();
          renderApp();
        }
      }
    }

    function editItem(itemId) { openItemModal(itemId); }

    function togglePassword(id) {
      const el = document.getElementById(`pwd_${id}`);
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => alert("已複製到剪貼簿！"));
    }

    // 分類 CRUD
    function addNewCategory() {
      const title = prompt("請輸入新分類名稱：");
      if (title) {
        vaultData.push({ id: 'cat_' + Date.now(), title: title, items: [] });
        saveVaultData();
        renderApp();
      }
    }

    function deleteCategory(catId) {
      if (confirm("刪除分類將會同時刪除分類下的所有密碼，確定繼續？")) {
        vaultData = vaultData.filter(c => c.id !== catId);
        saveVaultData();
        renderApp();
      }
    }

    // 加密算法 (PBKDF2 + AES-GCM)
    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
      );
    }

    async function generatePDFBackup() {
      const password = prompt("請設定備份檔的加密密碼：");
      if (!password) return;

      try {
        const rawData = JSON.stringify(vaultData);
        const enc = new TextEncoder();
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        
        const key = await deriveKey(password, salt);
        const encryptedContent = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(rawData));

        const backupPackage = {
          encrypted: true,
          salt: Array.from(salt),
          iv: Array.from(iv),
          data: Array.from(new Uint8Array(encryptedContent))
        };

        const base64Payload = btoa(JSON.stringify(backupPackage));
        document.getElementById('pdfDate').innerText = new Date().toLocaleDateString();
        document.getElementById('pdfPayload').innerText = base64Payload;

        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById('qrcode'), { text: base64Payload.substring(0, 800), width: 160, height: 160 });

        window.print();
      } catch (err) {
        alert("生成 PDF 失敗：" + err.message);
      }
    }

    async function importFromQRCode() {
      const payload = prompt("請貼上 PDF 備份檔中的「加密備份密文」：");
      if (!payload) return;

      try {
        const pkg = JSON.parse(atob(payload.trim()));
        const password = prompt("請輸入該備份檔的解密密碼：");
        if (!password) return;

        const key = await deriveKey(password, new Uint8Array(pkg.salt));
        const decryptedContent = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: new Uint8Array(pkg.iv) }, key, new Uint8Array(pkg.data)
        );

        const parsed = JSON.parse(new TextDecoder().decode(decryptedContent));
        if (confirm("驗證成功！確定要匯入並覆蓋現有資料？")) {
          vaultData = parsed;
          saveVaultData();
          renderApp();
          alert("資料已成功還原！");
        }
      } catch (err) {
        alert("還原失敗：密碼錯誤或密文格式無效。");
      }
    }

    // 解鎖與生物辨識
    function unlockApp() {
      const input = document.getElementById('passcodeInput').value;
      if (input === localStorage.getItem('black_vault_passcode')) {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
      } else { alert("解鎖密碼錯誤！"); }
    }

    async function registerBiometrics() {
      if (!window.PublicKeyCredential) return alert("裝置不支援 Face ID/Touch ID");
      try {
        const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
        const cred = await navigator.credentials.create({
          publicKey: {
            challenge, rp: { name: "黑匣 Black Vault" },
            user: { id: Uint8Array.from("user", c => c.charCodeAt(0)), name: "user@blackvault", displayName: "黑匣用戶" },
            pubKeyCredParams: [{ alg: -7, type: "public-key" }],
            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }
          }
        });
        if (cred) {
          localStorage.setItem('black_vault_bio_credential', cred.id);
          localStorage.setItem('black_vault_bio_enabled', 'true');
          alert("Face ID / Touch ID 成功啟用！");
          updatePasscodeUI();
        }
      } catch (err) { alert("設定失敗: " + err.message); }
    }

    async function unlockWithBiometrics() {
      if (!localStorage.getItem('black_vault_bio_credential')) return;
      try {
        const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
        const assertion = await navigator.credentials.get({ publicKey: { challenge, userVerification: "required" } });
        if (assertion) {
          document.getElementById('lockScreen').style.display = 'none';
          document.getElementById('mainApp').style.display = 'block';
        }
      } catch (err) { console.warn("驗證取消或失敗"); }
    }

    function setAppPasscode() {
      const newPass = prompt("請設定 App 解鎖密碼：");
      if (newPass && newPass === prompt("請再次確認密碼：")) {
        localStorage.setItem('black_vault_passcode', newPass);
        alert("設定完成！");
        updatePasscodeUI();
      }
    }

    function removeAppPasscode() {
      if (prompt("輸入舊密碼以關閉保護：") === localStorage.getItem('black_vault_passcode')) {
        localStorage.removeItem('black_vault_passcode');
        localStorage.removeItem('black_vault_bio_enabled');
        localStorage.removeItem('black_vault_bio_credential');
        alert("解鎖防護已關閉！");
        updatePasscodeUI();
      }
    }

    function updatePasscodeUI() {
      const saved = localStorage.getItem('black_vault_passcode');
      const bio = localStorage.getItem('black_vault_bio_enabled');
      const text = document.getElementById('lockStatusText');
      if (saved) {
        text.innerText = `目前狀態：已啟用密碼保護 🔒 ${bio ? '+ Face ID 👤' : ''}`;
        text.style.color = "#00f0ff";
        document.getElementById('removePassBtn').style.display = 'block';
        document.getElementById('enableBioBtn').style.display = 'block';
      } else {
        text.innerText = "目前狀態：未設定解鎖密碼";
        text.style.color = "var(--text-sub)";
        document.getElementById('removePassBtn').style.display = 'none';
        document.getElementById('enableBioBtn').style.display = 'none';
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
