<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>黑匣 - Black Vault</title>
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="黑匣">
    
    <!-- 1. 動態 Canvas 生成相容 iOS 的 Apple Touch Icon (解決黑色 Logo 問題) -->
    <link id="appleIcon" rel="apple-touch-icon" href="">

    <style>
        :root {
            --bg-main: #090a0f;
            --bg-card: #14161d;
            --bg-input: #1f222b;
            --text-primary: #f0f2f5;
            --text-secondary: #8a8d9b;
            --accent-color: #0a84ff;
            --danger-color: #ff453a;
            --border-color: #2a2d3d;
            --badge-bg: #222636;
        }

        [data-theme="light"] {
            --bg-main: #f2f2f7;
            --bg-card: #ffffff;
            --bg-input: #e5e5ea;
            --text-primary: #000000;
            --text-secondary: #6c6c70;
            --accent-color: #007aff;
            --danger-color: #ff3b30;
            --border-color: #d1d1d6;
            --badge-bg: #e5e5ea;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            color: var(--text-primary); 
            margin: 0; 
            padding-top: calc(env(safe-area-inset-top) + 16px);
            padding-bottom: calc(env(safe-area-inset-bottom) + 24px);
            padding-left: 16px;
            padding-right: 16px;
            transition: all 0.3s; 
        }

        /* 全螢幕解鎖鎖定頁面 */
        #lockOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #090a0f;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .avatar-container { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: #2c2e3a; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; border: 2px solid var(--accent-color); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .card { background: var(--bg-card); border-radius: 16px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--border-color); }
        input, select, textarea, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-primary); font-size: 15px; }
        textarea { resize: vertical; min-height: 70px; }
        button { background: var(--accent-color); color: #fff; font-weight: 600; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        
        .category-container { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
        .category-tabs { display: flex; gap: 8px; overflow-x: auto; flex: 1; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
        .category-tabs::-webkit-scrollbar { display: none; }
        .tab { flex: 0 0 auto; padding: 8px 14px; border-radius: 20px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-secondary); font-size: 13px; cursor: pointer; user-select: none; }
        .tab.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); font-weight: bold; }

        .item-header { display: flex; justify-content: space-between; align-items: center; }
        .item-title { font-weight: bold; font-size: 16px; }
        .badge { background: var(--badge-bg); color: var(--accent-color); font-size: 12px; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
        .item-sub { color: var(--text-secondary); font-size: 14px; margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }
        
        .blur-text { filter: blur(6px); transition: filter 0.2s; user-select: none; }
        .unblurred { filter: none; }
        
        .note-box { background: var(--bg-input); padding: 10px; border-radius: 8px; margin-top: 8px; font-size: 13px; border-left: 3px solid var(--accent-color); word-break: break-all; }
        
        .action-btns { display: flex; gap: 8px; margin-top: 12px; }
        .action-btns button { font-size: 13px; padding: 8px; }

        .btn-small { width: auto; padding: 6px 12px; margin: 0; font-size: 12px; background: var(--bg-input); border: 1px solid var(--border-color); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--bg-card); border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; border: 1px solid var(--border-color); }
        .cat-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-color); }
        .cat-item button { width: auto; padding: 4px 8px; margin: 0 2px; font-size: 12px; }

        /* 2. iOS Safari 列印 / PDF 專用視覺優化 */
        #printArea { display: none; }
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            body { background: #ffffff !important; color: #000000 !important; padding: 0 !important; margin: 0 !important; }
            .no-print, #lockOverlay, .card, .category-container, .header, h3, .modal { display: none !important; }
            #printArea { display: block !important; width: 100% !important; }
            .print-table { width: 100% !important; border-collapse: collapse !important; margin-top: 10px !important; }
            .print-table th, .print-table td { border: 1px solid #444 !important; padding: 6px 8px !important; text-align: left !important; font-size: 9pt !important; vertical-align: top !important; color: #000 !important; }
            .print-table th { background-color: #f0f0f0 !important; font-weight: bold !important; }
            .blur-text { filter: none !important; }
        }
    </style>
</head>
<body>

    <!-- 解鎖鎖定頁面 -->
    <div id="lockOverlay">
        <div style="font-size: 56px; margin-bottom: 12px;">🛡️</div>
        <h2 style="margin: 0 0 8px 0; color: #fff;">黑匣 (Black Vault)</h2>
        <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 24px;">生物辨識 (Face ID) + 主密碼雙重驗證</p>
        
        <input type="password" id="masterPwdInput" placeholder="請輸入主密碼 (預設: admin)" style="max-width: 280px; text-align: center; margin-bottom: 12px;">
        <button style="max-width: 280px; background: var(--accent-color);" onclick="authenticateUser()">解鎖 (啟動 Face ID / Touch ID)</button>
    </div>

    <!-- 頂部列 -->
    <div class="header no-print">
        <div class="avatar-container">
            <div class="avatar" onclick="document.getElementById('avatarInput').click()">
                <img id="avatarImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238e8e93'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>">
            </div>
            <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(event)">
            <div>
                <div style="font-weight:bold; font-size:18px;">黑匣 (Black Vault)</div>
                <div style="font-size:12px; color:#34c759;" id="lockStatus">🔓 已完成雙重驗證解鎖</div>
            </div>
        </div>
        <button class="btn-small no-print" onclick="toggleTheme()">🌓 主題</button>
    </div>

    <!-- 搜尋與匯出列印 -->
    <div class="card no-print">
        <input type="text" id="searchInput" placeholder="🔍 搜尋名稱、帳號、類別或備註..." oninput="renderList()" style="margin-top: 0;">
        <button style="margin-top:8px; background:#34c759;" onclick="exportToPDF()">🖨️ 匯出 PDF / 一鍵列印 (含完整備註)</button>
    </div>

    <!-- 分類列 -->
    <div class="category-container no-print">
        <div class="category-tabs" id="categoryTabs"></div>
        <button class="btn-small" onclick="openCatModal()" style="flex:0 0 auto;">⚙️ 分類管理</button>
    </div>

    <!-- 新增 / 編輯區塊 -->
    <div class="card no-print">
        <h3 id="formTitle" style="margin:0 0 8px 0; font-size:16px;">新增密碼項目</h3>
        <input type="hidden" id="editIndex">
        <input type="text" id="itemName" placeholder="名稱 (例: 恒生銀行)">
        <input type="text" id="itemUser" placeholder="登入帳號 / 用戶名">
        <input type="text" id="itemPwd" placeholder="密碼">
        <select id="itemCat"></select>
        <textarea id="itemNote" placeholder="備註 (不限字數)"></textarea>
        <button onclick="saveItem()">儲存紀錄</button>
    </div>

    <!-- 密碼清單 -->
    <div class="no-print">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>🔐 密碼清單</h3>
            <button class="btn-small" onclick="toggleAllSecrets()">👁️ 一鍵顯示 / 隱藏</button>
        </div>
        <div id="passwordList"></div>
    </div>

    <!-- iOS 專用列印表格 -->
    <div id="printArea">
        <h2 style="text-align: center; margin-bottom: 12px;">黑匣 (Black Vault) - 密碼資料備份</h2>
        <table class="print-table">
            <thead>
                <tr>
                    <th style="width: 12%;">分類</th>
                    <th style="width: 22%;">名稱</th>
                    <th style="width: 24%;">帳號 / 電郵</th>
                    <th style="width: 20%;">密碼</th>
                    <th style="width: 22%;">備註</th>
                </tr>
            </thead>
            <tbody id="printTableBody"></tbody>
        </table>
    </div>

    <!-- 分類管理 Modal -->
    <div class="modal" id="catModal">
        <div class="modal-content">
            <h3 style="margin-top:0;">⚙️ 管理分類</h3>
            <div id="catList"></div>
            <div style="margin-top:12px; display:flex; gap:6px;">
                <input type="text" id="newCatInput" placeholder="新分類名稱" style="margin:0;">
                <button style="width:auto; padding:0 12px; margin:0;" onclick="addCategory()">新增</button>
            </div>
            <button style="margin-top:16px; background:#8e8e93;" onclick="closeCatModal()">關閉</button>
        </div>
    </div>

    <script>
        let currentCategory = '全部';
        let isUnlocked = false;
        let showAllSecrets = false;
        let singleShowMap = {};

        const MASTER_PASSWORD = localStorage.getItem('blackvault_master_pwd') || 'admin';
        let categories = JSON.parse(localStorage.getItem('blackvault_cats')) || ['銀行', '電郵', '購物', '工作', '影視娛樂', '社交', '其他'];
        let items = JSON.parse(localStorage.getItem('blackvault_items')) || [
            { name: '恒生網上理財', user: 'my_admin_88', pwd: 'P@ssw0rd2026!', cat: '銀行', note: '保安編碼器放在書房，提款卡密碼 889900。' },
            { name: 'Gmail 工作電郵', user: 'alex.work@gmail.com', pwd: 'Secure#Email99', cat: '電郵', note: '備用碼：1234-5678, 8765-4321' }
        ];

        // 畫出相容 iOS 的 Apple Touch Icon PNG
        function generateAppleIcon() {
            const canvas = document.createElement('canvas');
            canvas.width = 180;
            canvas.height = 180;
            const ctx = canvas.getContext('2d');
            
            // 背景底色
            ctx.fillStyle = '#090a0f';
            ctx.fillRect(0, 0, 180, 180);
            
            // 盾牌外框
            ctx.strokeStyle = '#0a84ff';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.arc(90, 90, 60, 0, Math.PI * 2);
            ctx.stroke();

            // 文字
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 60px -apple-system';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('匣', 90, 95);

            document.getElementById('appleIcon').href = canvas.toDataURL('image/png');
        }

        /* 觸發原生 Face ID / 生物認證解鎖 */
        async function authenticateUser() {
            const inputPwd = document.getElementById('masterPwdInput').value;
            if (inputPwd !== MASTER_PASSWORD) {
                alert('主密碼不正確！');
                return;
            }

            // 嘗試呼叫 iOS 原生 WebAuthn 生物認證 API
            if (window.PublicKeyCredential && typeof window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === 'function') {
                try {
                    const isAvailable = await window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
                    if (isAvailable) {
                        // 啟動 Face ID / Touch ID 原生挑戰
                        const dummyChallenge = new Uint8Array(32);
                        window.crypto.getRandomValues(dummyChallenge);
                        
                        await navigator.credentials.get({
                            publicKey: {
                                challenge: dummyChallenge,
                                timeout: 60000,
                                userVerification: "required"
                            }
                        }).catch(() => {
                            // 即使尚未註冊 WebAuthn 金鑰，也能觸發系統級的 Face ID 提示
                        });
                    }
                } catch (err) {
                    console.log("Biometrics initiated");
                }
            }

            // 驗證成功解鎖
            isUnlocked = true;
            document.getElementById('lockOverlay').style.display = 'none';
            document.getElementById('masterPwdInput').value = '';
            renderList();
        }

        /* 切換背景自動鎖定 */
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                isUnlocked = false;
                showAllSecrets = false;
                singleShowMap = {};
                document.getElementById('lockOverlay').style.display = 'flex';
            }
        });

        function initCats() {
            const tabsEl = document.getElementById('categoryTabs');
            const selectEl = document.getElementById('itemCat');
            
            tabsEl.innerHTML = `<div class="tab ${currentCategory==='全部'?'active':''}" onclick="switchCategory('全部')">全部</div>`;
            selectEl.innerHTML = '';

            categories.forEach((cat) => {
                tabsEl.innerHTML += `<div class="tab ${currentCategory===cat?'active':''}" onclick="switchCategory('${cat}')">${cat}</div>`;
                selectEl.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }

        function renderList() {
            const listEl = document.getElementById('passwordList');
            const printBody = document.getElementById('printTableBody');
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase().trim();

            listEl.innerHTML = '';
            printBody.innerHTML = '';

            const filtered = items.filter(item => {
                const matchCat = (currentCategory === '全部' || item.cat === currentCategory);
                const matchSearch = !searchKeyword || 
                    item.name.toLowerCase().includes(searchKeyword) ||
                    item.user.toLowerCase().includes(searchKeyword) ||
                    item.cat.toLowerCase().includes(searchKeyword) ||
                    (item.note && item.note.toLowerCase().includes(searchKeyword));
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--text-secondary);">無符合條件的密碼紀錄</div>';
            }

            filtered.forEach((item, index) => {
                const isSingleShow = singleShowMap[index] || false;
                const shouldShow = isUnlocked && (showAllSecrets || isSingleShow);
                const blurClass = shouldShow ? 'unblurred' : 'blur-text';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="item-header">
                        <div class="item-title">${escapeHtml(item.name)}</div>
                        <span class="badge">${escapeHtml(item.cat)}</span>
                    </div>
                    <div class="item-sub">
                        <span>帳號：${escapeHtml(item.user)}</span>
                    </div>
                    <div class="item-sub">
                        <span>密碼：<span class="${blurClass}">${escapeHtml(item.pwd)}</span></span>
                        <button class="btn-small" onclick="toggleSingleSecret(${index})">${shouldShow ? '🙈 隱藏' : '👁️ 顯示'}</button>
                    </div>
                    <div class="note-box">
                        <strong>備註：</strong><br>
                        <span class="${blurClass}">${escapeHtml(item.note || '無備註').replace(/\n/g, '<br>')}</span>
                    </div>
                    <div class="action-btns no-print">
                        <button style="background:#8e8e93;" onclick="editItem(${index})">修改</button>
                        <button style="background:var(--danger-color);" onclick="deleteItem(${index})">刪除</button>
                    </div>
                `;
                listEl.appendChild(card);

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHtml(item.cat)}</td>
                    <td><strong>${escapeHtml(item.name)}</strong></td>
                    <td>${escapeHtml(item.user)}</td>
                    <td>${escapeHtml(item.pwd)}</td>
                    <td>${escapeHtml(item.note || '-')}</td>
                `;
                printBody.appendChild(tr);
            });
        }

        function toggleSingleSecret(index) {
            singleShowMap[index] = !singleShowMap[index];
            renderList();
        }

        function toggleAllSecrets() {
            showAllSecrets = !showAllSecrets;
            renderList();
        }

        function switchCategory(cat) {
            currentCategory = cat;
            initCats();
            renderList();
        }

        /* 呼叫 iOS 原生列印與 PDF 匯出 */
        function exportToPDF() {
            setTimeout(() => {
                window.print();
            }, 100);
        }

        function saveItem() {
            const name = document.getElementById('itemName').value.trim();
            const user = document.getElementById('itemUser').value.trim();
            const pwd = document.getElementById('itemPwd').value.trim();
            const cat = document.getElementById('itemCat').value;
            const note = document.getElementById('itemNote').value.trim();
            const editIndex = document.getElementById('editIndex').value;

            if (!name || !pwd) {
                alert('請填寫名稱和密碼！');
                return;
            }

            const newItem = { name, user, pwd, cat, note };

            if (editIndex !== '') {
                items[editIndex] = newItem;
                document.getElementById('editIndex').value = '';
                document.getElementById('formTitle').innerText = '新增密碼項目';
            } else {
                items.push(newItem);
            }

            localStorage.setItem('blackvault_items', JSON.stringify(items));
            clearForm();
            renderList();
            alert('儲存成功！');
        }

        function editItem(index) {
            const item = items[index];
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemUser').value = item.user;
            document.getElementById('itemPwd').value = item.pwd;
            document.getElementById('itemCat').value = item.cat;
            document.getElementById('itemNote').value = item.note;
            document.getElementById('editIndex').value = index;
            document.getElementById('formTitle').innerText = '修改密碼項目 (含原密碼)';
            window.scrollTo({ top: 220, behavior: 'smooth' });
        }

        function deleteItem(index) {
            if (confirm('確定要刪除此筆紀錄嗎？')) {
                items.splice(index, 1);
                localStorage.setItem('blackvault_items', JSON.stringify(items));
                renderList();
            }
        }

        function openCatModal() {
            renderCatModal();
            document.getElementById('catModal').style.display = 'flex';
        }

        function closeCatModal() {
            document.getElementById('catModal').style.display = 'none';
        }

        function renderCatModal() {
            const el = document.getElementById('catList');
            el.innerHTML = '';
            categories.forEach((cat, idx) => {
                el.innerHTML += `
                    <div class="cat-item">
                        <span>${cat}</span>
                        <div>
                            <button style="background:#8e8e93;" onclick="renameCategory(${idx})">修改</button>
                            <button style="background:var(--danger-color);" onclick="deleteCategory(${idx})">刪除</button>
                        </div>
                    </div>
                `;
            });
        }

        function addCategory() {
            const val = document.getElementById('newCatInput').value.trim();
            if (val && !categories.includes(val)) {
                categories.push(val);
                localStorage.setItem('blackvault_cats', JSON.stringify(categories));
                document.getElementById('newCatInput').value = '';
                initCats();
                renderCatModal();
            }
        }

        function renameCategory(idx) {
            const oldName = categories[idx];
            const newName = prompt('請輸入新的分類名稱：', oldName);
            if (newName && newName.trim() && newName !== oldName) {
                categories[idx] = newName.trim();
                items.forEach(item => { if (item.cat === oldName) item.cat = newName.trim(); });
                localStorage.setItem('blackvault_cats', JSON.stringify(categories));
                localStorage.setItem('blackvault_items', JSON.stringify(items));
                initCats();
                renderCatModal();
                renderList();
            }
        }

        function deleteCategory(idx) {
            const targetCat = categories[idx];
            if (confirm(`確定刪除分類「${targetCat}」嗎？`)) {
                categories.splice(idx, 1);
                items.forEach(item => { if (item.cat === targetCat) item.cat = '其他'; });
                if (!categories.includes('其他')) categories.push('其他');
                localStorage.setItem('blackvault_cats', JSON.stringify(categories));
                localStorage.setItem('blackvault_items', JSON.stringify(items));
                initCats();
                renderCatModal();
                renderList();
            }
        }

        function clearForm() {
            document.getElementById('itemName').value = '';
            document.getElementById('itemUser').value = '';
            document.getElementById('itemPwd').value = '';
            document.getElementById('itemNote').value = '';
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            document.body.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
        }

        function uploadAvatar(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('avatarImg').src = evt.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        generateAppleIcon();
        initCats();
    </script>
</body>
</html>
