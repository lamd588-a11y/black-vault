<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>黑匣 - Black Vault</title>
    
    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="黑匣">
    
    <!-- 型格黑 SVG App Icon -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' width='512' height='512'><rect width='512' height='512' rx='112' fill='%230b0c0e'/><rect x='16' y='16' width='480' height='480' rx='96' fill='none' stroke='%232a2e39' stroke-width='8'/><path d='M256 120 L360 170 V260 C360 330 310 390 256 410 C202 390 152 330 152 260 V170 Z' fill='none' stroke='%23e0e0e0' stroke-width='16' stroke-linejoin='round'/><path d='M256 210 C230 210 210 230 210 256 C210 282 230 302 302 256' fill='none' stroke='%238e8e93' stroke-width='12' stroke-linecap='round'/></svg>">

    <style>
        :root {
            --bg-main: #0b0c0e;
            --bg-card: #16181d;
            --bg-input: #21242c;
            --text-primary: #f0f2f5;
            --text-secondary: #8e8e93;
            --accent-color: #0a84ff;
            --danger-color: #ff453a;
            --border-color: #2c2e36;
            --badge-bg: #2c2e3b;
        }

        [data-theme="light"] {
            --bg-main: #f2f2f7;
            --bg-card: #ffffff;
            --bg-input: #e5e5ea;
            --text-primary: #000000;
            --text-secondary: #6c6c70;
            --accent-color: #007aff;
            --danger-color: #ff3b30;
            --border-color: #d1d1d6;
            --badge-bg: #e5e5ea;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); margin: 0; padding: 20px 16px; transition: all 0.3s; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .avatar-container { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: #3a3a3c; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; border: 2px solid var(--accent-color); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
        input, select, textarea, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-primary); font-size: 15px; }
        textarea { resize: vertical; min-height: 80px; }
        button { background: var(--accent-color); color: #fff; font-weight: 600; border: none; cursor: pointer; }
        
        .category-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 16px; -webkit-overflow-scrolling: touch; }
        .category-tabs::-webkit-scrollbar { display: none; }
        .tab { flex: 0 0 auto; padding: 8px 16px; border-radius: 20px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-secondary); font-size: 14px; cursor: pointer; }
        .tab.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); font-weight: bold; }

        .item-header { display: flex; justify-content: space-between; align-items: center; }
        .item-title { font-weight: bold; font-size: 17px; }
        .badge { background: var(--badge-bg); color: var(--accent-color); font-size: 12px; padding: 4px 8px; border-radius: 6px; font-weight: 600; }
        .item-sub { color: var(--text-secondary); font-size: 14px; margin-top: 6px; }
        .blur-text { filter: blur(6px); transition: filter 0.3s; user-select: none; }
        .unblurred { filter: none; }
        .note-box { background: var(--bg-input); padding: 10px; border-radius: 8px; margin-top: 8px; font-size: 13px; border-left: 3px solid var(--accent-color); word-break: break-all; }
        
        .action-btns { display: flex; gap: 8px; margin-top: 12px; }
        .action-btns button { font-size: 13px; padding: 8px; }

        /* 🖨️ PDF 及 A4 專用極致精簡排版（確保每頁 30+ 項目） */
        .print-table { display: none; }

        @media print {
            @page { margin: 8mm 10mm; size: A4 portrait; }
            body { background: #fff !important; color: #000 !important; padding: 0 !important; margin: 0 !important; font-size: 9.5pt !important; }
            .no-print, .card, .category-tabs, h3 { display: none !important; }
            
            .print-table { display: table !important; width: 100% !important; border-collapse: collapse !important; margin: 0 !important; }
            .print-table th, .print-table td { border: 1px solid #b0b0b0 !important; padding: 4px 6px !important; text-align: left !important; font-size: 9.5pt !important; vertical-align: top !important; line-height: 1.25 !important; }
            .print-table th { background-color: #f0f0f0 !important; font-weight: bold !important; color: #000 !important; }
            .print-title { display: block !important; font-size: 14pt !important; font-weight: bold !important; margin-bottom: 6px !important; text-align: center !important; }
            .blur-text { filter: none !important; }
            .print-note { font-size: 8.5pt !important; color: #444 !important; }
            .pwd-code { font-family: monospace !important; font-weight: bold !important; }
        }
    </style>
</head>
<body>

    <!-- 頂部列：頭像與主題切換 -->
    <div class="header no-print">
        <div class="avatar-container">
            <div class="avatar" onclick="document.getElementById('avatarInput').click()">
                <img id="avatarImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238e8e93'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>">
            </div>
            <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(event)">
            <div>
                <div style="font-weight:bold; font-size:18px;">黑匣 (Black Vault)</div>
                <div style="font-size:12px; color:var(--text-secondary);" id="lockStatus">🔒 已雙重加密鎖定</div>
            </div>
        </div>
        <button class="no-print" style="width:auto; padding:8px 12px;" onclick="toggleTheme()">🌓 主題</button>
    </div>

    <!-- 解鎖與列印操作 -->
    <div class="card no-print">
        <button onclick="unlockApp()">🔓 Face ID / 生物驗證解鎖隱蔽資料</button>
        <button style="margin-top:8px; background:#34c759;" onclick="printPDF()">🖨️ 一鍵列印 / 匯出 PDF (超緊湊版)</button>
    </div>

    <!-- 分類切換標籤 (Tabs) -->
    <div class="category-tabs no-print" id="categoryTabs">
        <div class="tab active" onclick="switchCategory('全部')">全部</div>
        <div class="tab" onclick="switchCategory('銀行')">銀行</div>
        <div class="tab" onclick="switchCategory('電郵')">電郵</div>
        <div class="tab" onclick="switchCategory('購物')">購物</div>
        <div class="tab" onclick="switchCategory('工作')">工作</div>
        <div class="tab" onclick="switchCategory('影視娛樂')">影視娛樂</div>
        <div class="tab" onclick="switchCategory('社交')">社交</div>
    </div>

    <!-- 新增 / 編輯密碼區塊 -->
    <div class="card no-print">
        <h3 id="formTitle">新增密碼項目</h3>
        <input type="hidden" id="editIndex">
        <input type="text" id="itemName" placeholder="名稱 (例: 恒生銀行)">
        <input type="text" id="itemUser" placeholder="登入帳號 / 用戶名">
        <input type="password" id="itemPwd" placeholder="密碼">
        <select id="itemCat">
            <option value="銀行">銀行</option>
            <option value="電郵">電郵</option>
            <option value="購物">購物</option>
            <option value="工作">工作</option>
            <option value="影視娛樂">影視娛樂</option>
            <option value="社交">社交</option>
            <option value="其他">其他</option>
        </select>
        <textarea id="itemNote" placeholder="備註 (不限字數)"></textarea>
        <button onclick="saveItem()">儲存紀錄</button>
    </div>

    <!-- 密碼列表區塊 (螢幕顯示用) -->
    <div class="no-print">
        <h3>🔐 密碼清單</h3>
        <div id="passwordList"></div>
    </div>

    <!-- 🖨️ 列印/PDF 專用高清精簡表格 (每頁可容納 30+ 筆) -->
    <div id="printArea">
        <div class="print-title" style="display:none;">🔒 黑匣 (Black Vault) - 機密密碼紙本備份清單</div>
        <table class="print-table">
            <thead>
                <tr>
                    <th style="width: 8%;">分類</th>
                    <th style="width: 22%;">名稱 / 服務</th>
                    <th style="width: 25%;">帳號 / 電郵</th>
                    <th style="width: 20%;">密碼</th>
                    <th style="width: 25%;">備註</th>
                </tr>
            </thead>
            <tbody id="printTableBody"></tbody>
        </table>
    </div>

    <script>
        let currentCategory = '全部';
        let isUnlocked = false;

        let items = JSON.parse(localStorage.getItem('blackvault_items')) || [
            { name: '恒生網上理財', user: 'my_admin_88', pwd: 'P@ssw0rd2026!', cat: '銀行', note: '保安編碼器放在書房，提款卡密碼 889900。' },
            { name: 'Gmail 工作電郵', user: 'alex.work@gmail.com', pwd: 'Secure#Email99', cat: '電郵', note: '備用碼：1234-5678, 8765-4321' },
            { name: 'Netflix 影視', user: 'alex.movie@gmail.com', pwd: 'MoviePass2026', cat: '影視娛樂', note: '進階 4K 方案，每月 15 號扣帳。' }
        ];

        function renderList() {
            const listEl = document.getElementById('passwordList');
            const printBody = document.getElementById('printTableBody');
            
            listEl.innerHTML = '';
            printBody.innerHTML = '';

            const filtered = items.filter(item => currentCategory === '全部' || item.cat === currentCategory);

            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="card" style="text-align:center; color:var(--text-secondary);">此分類暫無紀錄</div>';
            }

            filtered.forEach((item, index) => {
                const blurClass = isUnlocked ? 'unblurred' : 'blur-text';
                
                // 1. 螢幕顯示卡片
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="item-header">
                        <div class="item-title">${escapeHtml(item.name)}</div>
                        <span class="badge">${escapeHtml(item.cat)}</span>
                    </div>
                    <div class="item-sub">帳號：${escapeHtml(item.user)}</div>
                    <div class="item-sub">密碼：<span class="${blurClass}">${escapeHtml(item.pwd)}</span></div>
                    <div class="note-box">
                        <strong>備註：</strong><br>
                        <span class="${blurClass}">${escapeHtml(item.note || '無備註').replace(/\n/g, '<br>')}</span>
                    </div>
                    <div class="action-btns no-print">
                        <button style="background:#8e8e93;" onclick="editItem(${index})">修改</button>
                        <button style="background:var(--danger-color);" onclick="deleteItem(${index})">刪除</button>
                    </div>
                `;
                listEl.appendChild(card);

                // 2. 列印專用精簡表格行
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHtml(item.cat)}</td>
                    <td><strong>${escapeHtml(item.name)}</strong></td>
                    <td>${escapeHtml(item.user)}</td>
                    <td class="pwd-code">${escapeHtml(item.pwd)}</td>
                    <td class="print-note">${escapeHtml(item.note || '-')}</td>
                `;
                printBody.appendChild(tr);
            });
        }

        function switchCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.innerText === cat);
            });
            renderList();
        }

        function unlockApp() {
            alert('正在啟動 Face ID / Touch ID 驗證...');
            isUnlocked = true;
            document.getElementById('lockStatus').innerText = '🔓 已解鎖敏感資料';
            renderList();
        }

        function printPDF() {
            if (!isUnlocked) {
                if (confirm('列印將包含完整的解密密碼與備註，是否先進行 Face ID 驗證解鎖？')) {
                    unlockApp();
                } else {
                    return;
                }
            }
            window.print();
        }

        function saveItem() {
            if (!isUnlocked) {
                alert('修改或新增資料前，請先完成 Face ID 驗證！');
                return;
            }

            const name = document.getElementById('itemName').value.trim();
            const user = document.getElementById('itemUser').value.trim();
            const pwd = document.getElementById('itemPwd').value.trim();
            const cat = document.getElementById('itemCat').value;
            const note = document.getElementById('itemNote').value.trim();
            const editIndex = document.getElementById('editIndex').value;

            if (!name || !pwd) {
                alert('請填寫名稱和密碼！');
                return;
            }

            const newItem = { name, user, pwd, cat, note };

            if (editIndex !== '') {
                items[editIndex] = newItem;
                document.getElementById('editIndex').value = '';
                document.getElementById('formTitle').innerText = '新增密碼項目';
            } else {
                items.push(newItem);
            }

            localStorage.setItem('blackvault_items', JSON.stringify(items));
            clearForm();
            renderList();
            alert('儲存成功！');
        }

        function editItem(index) {
            if (!isUnlocked) {
                alert('修改資料前，請先完成 Face ID 驗證！');
                return;
            }

            const item = items[index];
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemUser').value = item.user;
            document.getElementById('itemPwd').value = item.pwd;
            document.getElementById('itemCat').value = item.cat;
            document.getElementById('itemNote').value = item.note;
            document.getElementById('editIndex').value = index;
            document.getElementById('formTitle').innerText = '修改密碼項目';
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        function deleteItem(index) {
            if (!isUnlocked) {
                alert('刪除資料前，請先完成 Face ID 驗證！');
                return;
            }

            if (confirm('確定要刪除此筆密碼紀錄嗎？')) {
                items.splice(index, 1);
                localStorage.setItem('blackvault_items', JSON.stringify(items));
                renderList();
            }
        }

        function clearForm() {
            document.getElementById('itemName').value = '';
            document.getElementById('itemUser').value = '';
            document.getElementById('itemPwd').value = '';
            document.getElementById('itemNote').value = '';
        }

        function toggleTheme() {
            const current = document.body.getAttribute('data-theme');
            document.body.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
        }

        function uploadAvatar(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('avatarImg').src = evt.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        renderList();
    </script>
</body>
</html>
